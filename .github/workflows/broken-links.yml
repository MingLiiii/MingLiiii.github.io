name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.bib"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.bib"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Template setup docs are not deployed; the CV's Liquid URLs are checked after Jekyll renders the site.
          # IEEE Xplore returns 418 to automated link checkers even for valid article URLs.
          args: >-
            --exclude-path README.md
            --exclude-path CUSTOMIZE.md
            --exclude-path INSTALL.md
            --exclude-path _pages/404.md
            --exclude-path _pages/blog.md
            --exclude-path _pages/cv[.]md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude '^https://ieeexplore[.]ieee[.]org/abstract/document/'
            --verbose --no-progress './**/*.md' './**/*.html'
